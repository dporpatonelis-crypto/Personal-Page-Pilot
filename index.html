<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#213e48">
  <title>Προβολή τάξης · Personal Page Pilot</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="lesson-map.css">
  <link rel="stylesheet" href="classroom.css">
  <script type="module" src="classroom.mjs"></script>
</head>
<body>
  <header class="classroom-bar">
    <h1><img src="icon.svg" width="34" height="34" alt="">Προβολή τάξης</h1>
    <nav id="classroom-nav" aria-label="Επιλογή τάξης και μαθήματος" hidden>
      <label>Τάξη<select id="class-grade"></select></label>
      <label>Μάθημα<select id="class-lesson"></select></label>
      <button type="button" id="class-today" hidden>Σήμερα</button>
      <button type="button" id="class-fullscreen" hidden aria-label="Πλήρης οθόνη">⛶</button>
    </nav>
  </header>
  <div id="classroom-message" role="status"></div>
  <main id="classroom-map">
    <section class="classroom-empty" aria-live="polite">Φορτώνεται η προβολή τάξης…</section>
  </main>
</body>
</html>
